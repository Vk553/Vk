<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0d10;
    color: #c8ced8;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    position: relative;
    box-sizing: border-box;
  }

  /* خلفية شفافة ومثبتة بأسفل الشاشة */
  body::before {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('bg.webp');
    background-repeat: no-repeat;
    background-position: bottom center;
    background-size: cover;
    opacity: 0.35;
    z-index: -1;
    pointer-events: none;
  }

  #wrap {
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  #out {
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: rgba(17, 21, 27, 0.85);
    border: 1px solid #1e2732;
    border-radius: 5px;
    padding: 10px 12px;
    height: calc(100vh - 90px);
    overflow-y: auto;
  }

  .ok { color: #7fd0a0; }
  .bad { color: #d08a7f; }
  .warn { color: #d8c07f; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
