<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
  html {
    background: #0b0d10;
  }

  body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #c8ced8;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    position: relative;
    box-sizing: border-box;
  }

  /* خلفية شفافة ومثبتة بأسفل الشاشة */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('bg.webp');
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: cover;
    opacity: 0.60; /* نسبة الشفافية للحصول على ألوان زاهية للصورة */
    z-index: -1;
    pointer-events: none;
  }

  #wrap {
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 10px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
  }

  #out {
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: transparent; /* إزالة الطبقة السوداء تماماً */
    border: none; /* إزالة الإطار الداكن */
    padding: 10px 0;
    height: calc(100vh - 90px);
    overflow-y: auto;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9); /* ظل خلف النص لضمان المقروئية */
  }

  .ok { color: #7fd0a0; }
  .bad { color: #d08a7f; }
  .warn { color: #d8c07f; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
